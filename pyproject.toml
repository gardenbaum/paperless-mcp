[project]
name = "paperless-mcp"
version = "0.1.0.dev0"
description = "MCP server for paperless-ngx 3.x."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gardenbaum" }]
dependencies = [
    "fastmcp>=4.1.6,<4.2",
    "httpx2>=2.16.0",
    "mcp>=2.3.0,<3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
paperless-mcp = "paperless_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "basedpyright>=1.40.2",
    "coverage>=7.17.2",
    "deptry>=0.25.1",
    "diff-cover>=11.0.1",
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "openapi-core>=0.23.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "syrupy>=6.1.1",
]

# --- Lint and format ---------------------------------------------------------

[tool.ruff]
line-length = 100
# Vendored third-party docs and project-management files are not our code.
extend-exclude = ["docs/vendor", ".superpowers", "backlog"]

[tool.ruff.lint]
select = ["ALL"]
# Every entry needs a reason. Suppressions in code: `# noqa: CODE -- reason` (see `just lint`).
ignore = [
    "COM812", # conflicts with `ruff format` (trailing commas are the formatter's job)
    "CPY001", # the licence lives in LICENSE; no per-file copyright headers
]

[tool.ruff.lint.per-file-ignores]
# The error names of design §5.2 (NotFound, Validation, ...) read as outcomes; an Error suffix adds nothing.
"src/paperless_mcp/domain/errors.py" = ["N818"]
# FastMCP evaluates tool signatures at runtime: their types must be imported, not TYPE_CHECKING-only.
"src/paperless_mcp/tools/*.py" = ["TC001", "TC002", "TC003"]
"tests/**" = [
    "D1",      # test names state the behaviour; a docstring would repeat them
    "INP001",  # tests are collected by pytest (importlib mode), not imported as a package
    "PLR2004", # literal expected values are the point of a test
    "S101",    # assert is how pytest checks
    "S105",    # fake credentials are test data
    "S106",    # fake credentials are test data
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime: their imports must not move under TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Mocks are banned: use a fake via constructor injection or httpx2.MockTransport."
"mock".msg = "Mocks are banned: use a fake via constructor injection or httpx2.MockTransport."
"pytest_mock".msg = "Mocks are banned: use a fake via constructor injection or httpx2.MockTransport."
"httpx".msg = "This project uses httpx2 only."

# --- Types -------------------------------------------------------------------

[tool.basedpyright]
# `recommended` enables every rule (some as warnings) and fails on warnings: stricter than
# `strict`. Fallback if FastMCP or Pydantic typing proves too noisy: `strict` + selected rules.
typeCheckingMode = "recommended"
pythonVersion = "3.14"
# Only our code; docs/vendor, .superpowers and backlog are outside this scope.
include = ["src", "tests"]
extraPaths = ["src", "tests"]
# `# type: ignore` silences every rule on its line in pyright; only `# pyright: ignore[rule]` counts.
enableTypeIgnoreComments = false

# --- Tests and coverage ------------------------------------------------------

[tool.pytest]
strict = true
# E2E tests need the docker compose stack (`just e2e`): `just check` deselects them.
addopts = ["--import-mode=importlib", "-ra", "-m", "not e2e", "-p", "pytester"]
testpaths = ["tests"]
# tests/e2e/helpers.py is imported as `e2e.helpers` (importlib mode adds no import path).
pythonpath = ["tests"]
filterwarnings = ["error"]
markers = [
    "e2e: runs against the real Paperless stack of tests/e2e/compose.yaml (`just e2e`)",
    "decision(id): the test guards the Backlog decision with this id, e.g. \"decision-1\"",
    "contract(method): a contract test of this port method, e.g. \"InstanceReader.get_overview\"",
]

[tool.coverage.run]
branch = true
source = ["src/paperless_mcp"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_empty = true
# The only coverage exclusions: reviewed patterns for lines that never run by design. Inline
# `# pragma` comments are banned (`just hygiene`); add a pattern here when a real need exists.
exclude_also = [
    "if TYPE_CHECKING:",    # imports for annotations only
    "^\\s*\\.\\.\\.$",      # bodies of Protocol methods and overloads
]

# --- Architecture (design §5.1) ----------------------------------------------

[tool.importlinter]
root_package = "paperless_mcp"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: entrypoints > server > observability > settings > tools | paperless > services > domain"
type = "layers"
containers = ["paperless_mcp"]
# Every module below the package root must be placed in a layer, so nothing in the layers imports
# the entrypoints. The root itself (`__init__.py`) is the container: its own contract follows.
exhaustive = true
layers = [
    "__main__ : app : cli",
    "server",
    "observability",
    "settings",
    "tools | paperless",
    "services",
    "domain",
]

[[tool.importlinter.contracts]]
name = "The package root imports nothing from the package and no I/O or MCP library"
type = "forbidden"
source_modules = ["paperless_mcp"]
as_packages = false
forbidden_modules = ["paperless_mcp.**", "httpx2", "fastmcp", "mcp", "pydantic_settings"]

[[tool.importlinter.contracts]]
name = "The adapter does not use services"
type = "forbidden"
source_modules = ["paperless_mcp.paperless"]
forbidden_modules = ["paperless_mcp.services"]

[[tool.importlinter.contracts]]
name = "Only the composition root imports tools and paperless"
type = "forbidden"
source_modules = [
    "paperless_mcp.__main__",
    "paperless_mcp.app",
    "paperless_mcp.cli",
    "paperless_mcp.settings",
]
forbidden_modules = ["paperless_mcp.tools", "paperless_mcp.paperless"]
# Entrypoints reach tools and paperless through server.py; only direct imports are wrong.
allow_indirect_imports = true

# The external-package rules below check direct imports only. That is complete because every
# module is either in a layer or the package root (which imports nothing from the package, see
# above): an indirect path to a forbidden package ends in a direct import that one of these
# contracts reports, and the layers block paths through the modules that may import it.
# (`protected` contracts would be simpler but fail while a package is not imported yet.)
# A module added to the layers joins the source lists below that apply to it.

[[tool.importlinter.contracts]]
name = "Only paperless imports httpx2"
type = "forbidden"
source_modules = [
    "paperless_mcp.__main__",
    "paperless_mcp.app",
    "paperless_mcp.cli",
    "paperless_mcp.server",
    "paperless_mcp.observability",
    "paperless_mcp.settings",
    "paperless_mcp.tools",
    "paperless_mcp.services",
    "paperless_mcp.domain",
]
forbidden_modules = ["httpx2"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# observability may import fastmcp too: its CallLogging is FastMCP middleware, and it sits
# above settings and below server in the layers, outside the source list below.
name = "Only tools, observability, server and entrypoints import fastmcp and mcp"
type = "forbidden"
source_modules = [
    "paperless_mcp.settings",
    "paperless_mcp.paperless",
    "paperless_mcp.services",
    "paperless_mcp.domain",
]
forbidden_modules = ["fastmcp", "mcp"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "No pydantic-settings below the composition root (configuration is injected)"
type = "forbidden"
source_modules = [
    "paperless_mcp.tools",
    "paperless_mcp.paperless",
    "paperless_mcp.services",
    "paperless_mcp.domain",
]
forbidden_modules = ["pydantic_settings"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "No httpx"
type = "forbidden"
source_modules = ["paperless_mcp"]
forbidden_modules = ["httpx"]

# Toolset independence (design §5.1: toolset modules in tools/ do not import each other, shared
# helpers live in tools/_shared) needs two toolset modules. The task that creates the second
# one adds an `independence` contract over all toolset modules here.
