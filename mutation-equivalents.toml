# Mutants that survive mutmut but cannot be killed by any test, reviewed one by one (PLMCP-21).
#
# `scripts/scheduled_jobs.py mutation-score` leaves a listed mutant out of the score only while it
# still shows up as "survived" in `mutmut results` and its function still has the source hash
# (`function_hash`, from mutants/mutmut-stats.json) it was reviewed with, because ids are positional.
# An entry that does not match (killed, renumbered, function edited) is stale: it is not counted and
# the run exits 4 until the entry is reviewed again (new hash if still equivalent, else removed). Every entry needs a reason
# that says why no test can tell the mutant from the original. Prefer a test that kills the mutant;
# add an entry here only after `mutmut show <mutant>` proved the change has no effect.

