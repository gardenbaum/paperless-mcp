project_name: "paperless-mcp"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "PLMCP"
definition_of_done:
  - "Tests written first (red, then green) at every test level the change touches"
  - "just check passes locally and all required CI checks are green on the PR"
  - "Snapshot, gate or decision changes are deliberate and explained in the PR description"
  - "Merged to main through the task's own pull request"
