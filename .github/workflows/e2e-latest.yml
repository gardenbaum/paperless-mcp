name: E2E against latest Paperless

# Weekly and on demand (design 9.2, 9.5): the E2E suite against the highest stable paperless-ngx
# 3.x image instead of the pinned one, to catch upstream changes before the next vendored bump.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "paperless-ngx release to test, e.g. 3.5.0 (default: the highest stable 3.x.y)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-latest
  cancel-in-progress: false

env:
  # renovate: datasource=pypi depName=rust-just
  RUST_JUST_VERSION: "1.59.0"

jobs:
  e2e-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      # An empty version resolves the latest stable 3.x tag (just e2e-latest).
      - run: just e2e-latest
        env:
          PAPERLESS_E2E_VERSION: ${{ inputs.version }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-latest-container-logs
          path: e2e-containers.log
          if-no-files-found: ignore
          retention-days: 7
