name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=pypi depName=rust-just
  RUST_JUST_VERSION: "1.59.0"

jobs:
  # Job names `check (3.14)` / `check (3.15)` and `audit` are the required status checks.
  check:
    name: check (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # diff-cover compares against origin/main

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # The gitleaks pre-commit hook is language: golang and builds with Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      # The recipes of `just check`, one step each; keep in step with the justfile.
      - run: just lock-check
      - run: just lint
      - run: just format-check
      - run: just typecheck
      - run: just imports
      - run: just deps
      - run: just secrets
      - run: just cov-diff origin/main

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Dependency audit (pip-audit with .pip-audit-ignore)
        run: just audit

      - name: Secret scan (gitleaks, whole history)
        run: just secrets
