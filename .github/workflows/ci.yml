name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=pypi depName=rust-just
  RUST_JUST_VERSION: "1.59.0"

jobs:
  # Job names `check (3.14)` / `check (3.15)`, `audit` and `e2e` are the required status checks.
  check:
    name: check (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # diff-cover compares against origin/main

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # The gitleaks pre-commit hook is language: golang and builds with Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      # The recipes of `just check`, one step each; keep in step with the justfile.
      - run: just lock-check
      - run: just lint
      - run: just format-check
      - run: just typecheck
      - run: just imports
      - run: just deps
      - run: just secrets
      - run: just cov-diff origin/main

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Dependency audit (pip-audit with .pip-audit-ignore)
        run: just audit

      - name: Secret scan (gitleaks, whole history)
        run: just secrets

  # Real paperless-ngx 3.4.2 + Redis from tests/e2e/compose.yaml; the same recipe as local runs.
  # Readiness waiting and seeding live in the test session, so `just e2e` is the whole job.
  e2e:
    runs-on: ubuntu-latest
    # 35, not 20: each toolset adds live tests. main took 11-12 minutes, and PR runs with one new
    # toolset passed 20 on slower runs. This only guards against hangs and is no quality gate;
    # PLMCP-39 brings the suite back under 20 minutes and lowers it again.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install just
        run: uv tool install "rust-just==${RUST_JUST_VERSION}"

      - name: Sync dependencies
        run: uv sync --locked

      - run: just e2e

      - name: Collect container logs
        if: failure()
        run: docker compose -f tests/e2e/compose.yaml logs --no-color > e2e-containers.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-container-logs
          path: e2e-containers.log
          retention-days: 7
